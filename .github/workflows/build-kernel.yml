name: Build Realme SM6650 (Snapdragon 6 Gen 4) Battery-Friendly Custom Kernel

on:
  workflow_dispatch:
    inputs:
      kernel_name:
        description: 'Nama / Versi Custom Kernel'
        required: true
        default: 'ZeroByte-Kernel'
      enable_ksu:
        description: 'Sematkan KernelSU-Next (Root hemat daya)'
        required: true
        type: boolean
        default: true
      enable_lto:
        description: 'Gunakan Clang ThinLTO (Optimasi ukuran & efisiensi)'
        required: true
        type: boolean
        default: true
  push:
    branches:
      - main

jobs:
  build-kernel:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Free Disk Space (Kosongkan Ruang Disk Runner)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Checkout Workflow Repository
        uses: actions/checkout@v4

      - name: Set Environment Variables & Tanggal
        run: |
          echo "BUILD_DATE=$(date +'%Y%m%d_%H%M%S')" >> $GITHUB_ENV
          echo "KERNEL_NAME=${{ github.event.inputs.kernel_name || 'ZeroByte-Kernel' }}" >> $GITHUB_ENV

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential bc bison flex libssl-dev libelf-dev libncurses5-dev \
            git zip unzip curl wget python3 python3-pip rsync zstd lz4 cpio \
            libyaml-dev binutils-aarch64-linux-gnu

      - name: Download AOSP Clang Toolchain (r487747c)
        run: |
          echo "Mengunduh AOSP Clang r487747c (Android 14 GKI reference)..."
          mkdir -p clang-aosp
          curl -s https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r487747c.tar.gz | tar -xz -C clang-aosp
          echo "$GITHUB_WORKSPACE/clang-aosp/bin" >> $GITHUB_PATH

      - name: Clone Realme SM6650 Common Kernel
        run: |
          echo "Cloning android_kernel_common_realme_sm6650 (Branch: realme/sm6650_16_b_16.0_p3_5g)..."
          git clone -b realme/sm6650_16_b_16.0_p3_5g --depth 1 \
            https://github.com/realme-kernel-opensource/android_kernel_common_realme_sm6650.git kernel_common

      - name: Setup KernelSU-Next (Opsional)
        if: ${{ github.event_name == 'push' || inputs.enable_ksu == true }}
        run: |
          cd kernel_common
          echo "Memasang KernelSU-Next..."
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s next
          echo "KernelSU-Next berhasil diterapkan."

      - name: Apply "Ringan & Hemat Baterai" Tuning
        run: |
          cd kernel_common
          DEFCONFIG="arch/arm64/configs/gki_defconfig"

          echo "==> Menerapkan modifikasi konfigurasi hemat daya pada $DEFCONFIG..."

          # 1. Matikan Debugging Bloat & Tracing yang memboroskan RAM & CPU
          # Catatan KMI: Simbol struct (seperti SCHEDSTATS) tetap dipertahankan agar layout struct
          # task_struct tidak berubah, mencegah symbol CRC mismatch pada modul Wi-Fi/Audio bawaan OEM.
          scripts/config --file $DEFCONFIG --disable DEBUG_INFO_DWARF4
          scripts/config --file $DEFCONFIG --disable DEBUG_INFO_BTF
          scripts/config --file $DEFCONFIG --disable PM_DEBUG
          scripts/config --file $DEFCONFIG --disable PM_ADVANCED_DEBUG
          scripts/config --file $DEFCONFIG --disable DYNAMIC_DEBUG_CORE
          scripts/config --file $DEFCONFIG --disable KUNIT_DEBUGFS
          scripts/config --file $DEFCONFIG --disable DEBUG_MEMORY_INIT
          scripts/config --file $DEFCONFIG --disable SLUB_DEBUG
          scripts/config --file $DEFCONFIG --disable CMA_DEBUGFS
          scripts/config --file $DEFCONFIG --disable ANDROID_DEBUG_SYMBOLS
          scripts/config --file $DEFCONFIG --disable ANDROID_DEBUG_KINFO

          # 2. Power Management & Deep Sleep
          scripts/config --file $DEFCONFIG --enable NO_HZ_IDLE
          scripts/config --file $DEFCONFIG --enable CPU_IDLE_GOV_MENU
          scripts/config --file $DEFCONFIG --enable CPU_FREQ_GOV_SCHEDUTIL

          # 3. Memory & ZRAM Optimization (Default LZ4: Zero-Overhead, Suhu Lebih Dingin & Hemat Baterai)
          scripts/config --file $DEFCONFIG --enable CRYPTO_LZ4
          scripts/config --file $DEFCONFIG --enable CRYPTO_ZSTD
          scripts/config --file $DEFCONFIG --set-str ZRAM_DEF_COMP "lz4"

          # 4. Jaringan Cepat & Rendah Latensi (TCP BBR)
          scripts/config --file $DEFCONFIG --enable TCP_CONG_BBR
          scripts/config --file $DEFCONFIG --set-str DEFAULT_TCP_CONG "bbr"

          # 5. ThinLTO (Link-Time Optimization)
          if [ "${{ github.event_name }}" = "push" ] || [ "${{ inputs.enable_lto }}" = "true" ]; then
            scripts/config --file $DEFCONFIG --enable LTO_CLANG_THIN
            scripts/config --file $DEFCONFIG --disable LTO_NONE
          fi

          # 6. Ganti Local Version name
          scripts/config --file $DEFCONFIG --set-str LOCALVERSION "-${KERNEL_NAME}"

          echo "Modifikasi defconfig selesai."

      - name: Compile GKI Kernel Image
        run: |
          cd kernel_common
          export PATH="$GITHUB_WORKSPACE/clang-aosp/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export CC=clang
          export LD=ld.lld
          export LLVM=1
          export LLVM_IAS=1
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-

          echo "==> Membuat konfigurasi defconfig..."
          make -j$(nproc --all) O=out gki_defconfig

          echo "==> Memulai kompilasi Kernel Image..."
          make -j$(nproc --all) O=out Image

          if [ ! -f "out/arch/arm64/boot/Image" ]; then
            echo "ERROR: Kernel Image tidak ditemukan! Kompilasi gagal."
            exit 1
          fi
          echo "Kompilasi sukses! Ukuran Image:"
          ls -lh out/arch/arm64/boot/Image

      - name: Package with AnyKernel3
        run: |
          echo "Mengunduh AnyKernel3..."
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git anykernel

          # Atur AnyKernel3 untuk Generic Kernel Image (GKI)
          sed -i 's/do.devicecheck=1/do.devicecheck=0/g' anykernel/anykernel.sh
          sed -i 's/block=auto;/block=boot;/g' anykernel/anykernel.sh
          sed -i 's/is_slot_device=0;/is_slot_device=auto;/g' anykernel/anykernel.sh

          # Salin Image hasil kompilasi
          cp kernel_common/out/arch/arm64/boot/Image anykernel/

          # Buat arsip flashable zip
          cd anykernel
          ZIP_NAME="${KERNEL_NAME}_Realme_SM6650_${BUILD_DATE}.zip"
          zip -r9 "../${ZIP_NAME}" * -x .git README.md *placeholder
          cd ..

          echo "ZIP_PATH=${ZIP_NAME}" >> $GITHUB_ENV
          echo "Flashable ZIP selesai: ${ZIP_NAME}"

      - name: Upload Kernel Zip Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: ${{ env.ZIP_PATH }}
          retention-days: 14

      - name: Generate Checksum & Release Notes
        run: |
          ZIP_SHA256=$(sha256sum "${ZIP_PATH}" | awk '{print $1}')
          echo "ZIP_SHA256=${ZIP_SHA256}" >> $GITHUB_ENV
          echo "RELEASE_TAG=v1.0.0-${BUILD_DATE}" >> $GITHUB_ENV

          cat << 'EOF' > release_notes.md
          ## ⚡ ZeroByte Kernel - Release Build
          *High-Efficiency, Lightweight & Battery-Oriented Custom Kernel for Snapdragon 6 Gen 4 (SM6650)*

          ---

          ### 📋 Catatan Perubahan & Fitur (Changelog):
          - 🚀 **ZRAM Compression**: Default diatur ke **LZ4** untuk *zero-overhead* CPU, kecepatan dekompresi instan, dan suhu tetap dingin saat multitasking intensif.
          - 🛡️ **KMI / GKI 2.0 ABI Protection**: Mempertahankan struktur biner kernel (KMI) 100% identik dengan standar GKI resmi agar modul hardware OEM (**Wi-Fi** `qca_cld3_wlan.ko` dan **Audio** `snd-soc-*.ko`) berfungsi normal tanpa kendala symbol mismatch.
          - 🧹 **Overhead Debugging Stripped**: Menghapus beban logging dan modul debug berat (`SLUB_DEBUG`, `DEBUG_INFO_BTF`, `DYNAMIC_DEBUG_CORE`, `PM_DEBUG`, `DEBUG_MEMORY_INIT`).
          - 🔋 **Power Management**: Deep sleep optimal via `CONFIG_NO_HZ_IDLE=y` dan `schedutil` governor.
          - ⚡ **Compiler Optimization**: Dikompilasi menggunakan AOSP Clang Reference Toolchain (`r487747c`) dengan ThinLTO untuk eksekusi kode yang padat dan efisien.
          - 🌐 **Network Latency**: Mengaktifkan TCP BBR congestion control untuk transmisi data yang hemat daya dan stabil.
          - 🔑 **Root Ready**: Terintegrasi KernelSU-Next bawaan.

          ---

          ### 📱 Informasi Paket & Checksum:
          - **Target Device**: Realme P3 5G / Realme 14 Series (RMX5070)
          - **Chipset**: Qualcomm Snapdragon 6 Gen 4 (SM6650)
          - **Kernel Version**: Linux 6.1.y GKI 2.0 (Android 14 / 15)
          - **Installer**: AnyKernel3 Flashable ZIP
          - **File**: `${ZIP_NAME}`
          - **SHA256**: `${ZIP_SHA256}`

          ---

          ### 📥 Panduan Pemasangan:
          1. Masuk ke Custom Recovery (TWRP / OrangeFox) atau buka KernelSU Manager.
          2. Flash file zip ini ke partisi `boot`.
          3. Reboot System (Wipe cache/dalvik bersifat opsional).
          EOF

          sed -i "s/\${ZIP_NAME}/${ZIP_NAME}/g" release_notes.md
          sed -i "s/\${ZIP_SHA256}/${ZIP_SHA256}/g" release_notes.md

      - name: Publish Auto GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.KERNEL_NAME }} - ${{ env.BUILD_DATE }}
          body_path: release_notes.md
          files: ${{ env.ZIP_PATH }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
