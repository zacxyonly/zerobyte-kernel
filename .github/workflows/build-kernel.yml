name: Build ZeroByte Kernel for Realme P3 5G (RMX5079 / dongfeng)

on:
  workflow_dispatch:
    inputs:
      variant:
        description: 'Varian Kernel yang akan dikompilasi'
        required: true
        type: choice
        options:
          - all
          - original
          - ksu
        default: 'all'
      kernel_name:
        description: 'Nama / Tag Custom Kernel'
        required: true
        default: 'ZeroByte-Kernel'
      enable_lto:
        description: 'Gunakan Clang ThinLTO (Optimasi ukuran & efisiensi biner)'
        required: true
        type: boolean
        default: true

jobs:
  build-kernel:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Free Disk Space (Kosongkan Ruang Disk Runner)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Checkout Workflow Repository
        uses: actions/checkout@v4

      - name: Set Environment Variables & Tanggal
        run: |
          echo "BUILD_DATE=$(date +'%Y%m%d_%H%M%S')" >> $GITHUB_ENV
          echo "KERNEL_NAME=${{ github.event.inputs.kernel_name || 'ZeroByte-Kernel' }}" >> $GITHUB_ENV
          echo "BUILD_VARIANT=${{ github.event.inputs.variant || 'all' }}" >> $GITHUB_ENV
          echo "ENABLE_LTO=${{ github.event.inputs.enable_lto != 'false' }}" >> $GITHUB_ENV

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential bc bison flex libssl-dev libelf-dev libncurses5-dev \
            git zip unzip curl wget python3 python3-pip rsync zstd lz4 cpio \
            libyaml-dev binutils-aarch64-linux-gnu

      - name: Download AOSP Clang Toolchain (r487747c)
        run: |
          echo "Mengunduh AOSP Clang r487747c (Android 14 GKI reference)..."
          mkdir -p clang-aosp
          curl -sSL "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android14-release/clang-r487747c.tar.gz" | tar -xz -C clang-aosp
          echo "$GITHUB_WORKSPACE/clang-aosp/bin" >> $GITHUB_PATH
          echo "Verifikasi Clang:"
          "$GITHUB_WORKSPACE/clang-aosp/bin/clang" --version

      - name: Clone Realme SM6650 Source Tree (Modules & Common Kernel)
        run: |
          echo "Cloning android_kernel_modules_and_devicetree_realme_sm6650 (Vendor tree)..."
          git clone -b realme/sm6650_16_b_16.0_p3_5g --depth 1 \
            https://github.com/realme-kernel-opensource/android_kernel_modules_and_devicetree_realme_sm6650.git workspace_root

          echo "Cloning android_kernel_common_realme_sm6650 into kernel_platform/common..."
          git clone -b realme/sm6650_16_b_16.0_p3_5g --depth 1 \
            https://github.com/realme-kernel-opensource/android_kernel_common_realme_sm6650.git workspace_root/kernel_platform/common

      - name: Setup Compiler Environment
        run: |
          echo "ARCH=arm64" >> $GITHUB_ENV
          echo "SUBARCH=arm64" >> $GITHUB_ENV
          echo "CC=clang" >> $GITHUB_ENV
          echo "LD=ld.lld" >> $GITHUB_ENV
          echo "LLVM=1" >> $GITHUB_ENV
          echo "LLVM_IAS=1" >> $GITHUB_ENV
          echo "CLANG_TRIPLE=aarch64-linux-gnu-" >> $GITHUB_ENV
          echo "CROSS_COMPILE=aarch64-linux-gnu-" >> $GITHUB_ENV

      # =========================================================================
      # VARIAN 1: ORIGINAL (NON-KSU / VANILLA)
      # =========================================================================
      - name: Compile Varian 1 - Original (Non-KSU)
        if: ${{ env.BUILD_VARIANT == 'all' || env.BUILD_VARIANT == 'original' }}
        run: |
          cd workspace_root/kernel_platform/common
          git checkout -f arch/arm64/configs/gki_defconfig >/dev/null 2>&1 || true

          # Apply modular configuration fragment
          "$GITHUB_WORKSPACE/configs/apply_config.sh" . "arch/arm64/configs/gki_defconfig" "${{ env.ENABLE_LTO }}" "${{ env.KERNEL_NAME }}"

          echo "==> [Varian 1 - Original] Menyiapkan defconfig..."
          make -j$(nproc --all) O=out_original gki_defconfig

          echo "==> [Varian 1 - Original] Mengompilasi Kernel Image..."
          make -j$(nproc --all) O=out_original Image

          if [ ! -f "out_original/arch/arm64/boot/Image" ]; then
            echo "ERROR: Kernel Image Varian Original tidak ditemukan!"
            exit 1
          fi
          echo "Kompilasi Varian 1 (Original) Berhasil!"

      - name: Package Varian 1 - Original (AnyKernel3)
        if: ${{ env.BUILD_VARIANT == 'all' || env.BUILD_VARIANT == 'original' }}
        run: |
          mkdir -p anykernel_original
          cp -r anykernel/* anykernel_original/
          cp workspace_root/kernel_platform/common/out_original/arch/arm64/boot/Image anykernel_original/

          cd anykernel_original
          ZIP_ORIGINAL="${KERNEL_NAME}_Original_SM6650_${BUILD_DATE}.zip"
          zip -r9 "../${ZIP_ORIGINAL}" * -x .git README.md *placeholder
          cd ..
          rm -rf anykernel_original

          echo "ZIP_ORIGINAL_NAME=${ZIP_ORIGINAL}" >> $GITHUB_ENV
          echo "ZIP_ORIGINAL_PATH=${ZIP_ORIGINAL}" >> $GITHUB_ENV
          echo "Varian 1 dikemas: ${ZIP_ORIGINAL}"

      # =========================================================================
      # VARIAN 2: KERNELSU-NEXT (KSU)
      # =========================================================================
      - name: Setup KernelSU-Next & Compile Varian 2
        if: ${{ env.BUILD_VARIANT == 'all' || env.BUILD_VARIANT == 'ksu' }}
        run: |
          cd workspace_root/kernel_platform/common
          git checkout -f arch/arm64/configs/gki_defconfig >/dev/null 2>&1 || true

          echo "==> Mengintegrasikan KernelSU-Next ke kernel tree..."
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s next

          # Apply modular configuration fragment
          "$GITHUB_WORKSPACE/configs/apply_config.sh" . "arch/arm64/configs/gki_defconfig" "${{ env.ENABLE_LTO }}" "${{ env.KERNEL_NAME }}"

          echo "==> [Varian 2 - KernelSU] Menyiapkan defconfig..."
          make -j$(nproc --all) O=out_ksu gki_defconfig

          echo "==> [Varian 2 - KernelSU] Mengompilasi Kernel Image..."
          make -j$(nproc --all) O=out_ksu Image

          if [ ! -f "out_ksu/arch/arm64/boot/Image" ]; then
            echo "ERROR: Kernel Image Varian KernelSU tidak ditemukan!"
            exit 1
          fi
          echo "Kompilasi Varian 2 (KernelSU) Berhasil!"

      - name: Package Varian 2 - KernelSU (AnyKernel3)
        if: ${{ env.BUILD_VARIANT == 'all' || env.BUILD_VARIANT == 'ksu' }}
        run: |
          mkdir -p anykernel_ksu
          cp -r anykernel/* anykernel_ksu/
          cp workspace_root/kernel_platform/common/out_ksu/arch/arm64/boot/Image anykernel_ksu/

          cd anykernel_ksu
          ZIP_KSU="${KERNEL_NAME}_KernelSU_SM6650_${BUILD_DATE}.zip"
          zip -r9 "../${ZIP_KSU}" * -x .git README.md *placeholder
          cd ..
          rm -rf anykernel_ksu

          echo "ZIP_KSU_NAME=${ZIP_KSU}" >> $GITHUB_ENV
          echo "ZIP_KSU_PATH=${ZIP_KSU}" >> $GITHUB_ENV
          echo "Varian 2 dikemas: ${ZIP_KSU}"

      # =========================================================================
      # ARTIFACTS & RELEASE
      # =========================================================================
      - name: Upload Kernel Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.KERNEL_NAME }}-SM6650-${{ env.BUILD_DATE }}
          path: "*.zip"
          retention-days: 14

      - name: Generate Checksums & Release Notes
        run: |
          echo "RELEASE_TAG=v1.0.0-${BUILD_DATE}" >> $GITHUB_ENV

          cat << 'EOF' > release_notes.md
          # ZeroByte Kernel for Realme P3 5G (dongfeng)

          High-efficiency, lightweight, and battery-oriented custom GKI 2.0 kernel for **Realme P3 5G (`RMX5079` / `dongfeng` / `SM6650`)**.

          ---

          ### 📦 Variants Included

          | Variant | File | Root Support | Details |
          |:---|:---|:---|:---|
          EOF

          if [ -n "${ZIP_ORIGINAL_NAME:-}" ]; then
            echo "| **Original** | \`${ZIP_ORIGINAL_NAME}\` | None / Standalone | Clean GKI kernel, banking & Play Integrity ready. |" >> release_notes.md
          fi
          if [ -n "${ZIP_KSU_NAME:-}" ]; then
            echo "| **KernelSU** | \`${ZIP_KSU_NAME}\` | KernelSU-Next | Integrated kernel-level root driver. |" >> release_notes.md
          fi

          cat << 'EOF' >> release_notes.md

          ---

          ### ⚡ Highlights
          - **Power & Sleep**: Tickless idle (`CONFIG_NO_HZ_IDLE=y`) and tuned `schedutil` governor.
          - **Memory**: Default **LZ4** ZRAM compression for zero-overhead RAM swap.
          - **KMI Compliance**: 100% GKI 2.0 ABI safe (OEM Wi-Fi & Audio modules load cleanly).
          - **Debloated**: Disabled heavy debug routines (`SLUB_DEBUG`, `DEBUG_INFO_BTF`, `DYNAMIC_DEBUG_CORE`).
          - **Networking**: TCP BBR congestion control enabled by default.
          - **Compiler**: AOSP Clang `r487747c` + ThinLTO.

          ---

          ### 📱 Verification (SHA256)
          | File | SHA256 Checksum |
          |:---|:---|
          EOF

          for zip_file in *.zip; do
            if [ -f "$zip_file" ]; then
              sha=$(sha256sum "$zip_file" | awk '{print $1}')
              echo "| \`$zip_file\` | \`$sha\` |" >> release_notes.md
            fi
          done

          cat << 'EOF' >> release_notes.md

          ---

          ### 🚀 Installation
          1. Boot into custom recovery (TWRP / OrangeFox).
          2. Flash your chosen variant `.zip`.
          3. Reboot system.

          > [!IMPORTANT]
          > Always backup your stock `boot` partition in recovery before flashing.
          EOF

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.KERNEL_NAME }} - ${{ env.BUILD_DATE }}
          body_path: release_notes.md
          files: "*.zip"
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
